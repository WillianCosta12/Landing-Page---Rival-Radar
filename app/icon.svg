<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#0a0c0b"/>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="13" stroke="#c6f24e" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Mid ring -->
  <circle cx="16" cy="16" r="8.5" stroke="#c6f24e" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Inner ring -->
  <circle cx="16" cy="16" r="4" stroke="#c6f24e" stroke-width="1" stroke-opacity="0.25"/>
  <!-- Sweep line -->
  <line x1="16" y1="16" x2="26.5" y2="7.5" stroke="#c6f24e" stroke-width="1.2" stroke-opacity="0.7" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="#c6f24e"/>
  <!-- Blip -->
  <circle cx="23" cy="10" r="2" fill="#c6f24e" fill-opacity="0.9"/>
  <circle cx="23" cy="10" r="3.5" fill="#c6f24e" fill-opacity="0.2"/>
</svg>
